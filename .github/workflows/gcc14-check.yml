name: GCC 13 vs 14 compile check (temporary)
on: [push, workflow_dispatch]
jobs:
  compile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 13.3.rel1
            sha256: 95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4
          - version: 14.3.rel1
            sha256: 8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Arm GNU Toolchain ${{ matrix.version }}
        run: |
          a=arm-gnu-toolchain-${{ matrix.version }}-x86_64-arm-none-eabi.tar.xz
          curl -sSfL -o $a "https://developer.arm.com/-/media/Files/downloads/gnu/${{ matrix.version }}/binrel/$a"
          echo "${{ matrix.sha256 }}  $a" | sha256sum -c
          mkdir -p ~/tc && tar xf $a -C ~/tc --strip-components=1
          echo "$HOME/tc/bin" >> $GITHUB_PATH
      - name: Generate git-commit-version.h (pre-build step)
        run: cd sw_stm32 && (bash scripts/create-git-info-header.sh || python3 scripts/create-git-info-header.py) && ls -la Core/Inc/git-commit-version.h
      - name: Compile all Release sources
        run: python3 compile_check.py | tee result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.version }}
          path: result.txt
